apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-admin
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: argocd-secret
    creationPolicy: Merge
  data:
    - secretKey: admin.password
      remoteRef:
        key: student-mgmt/argocd/admin
        property: passwordBcrypt
    - secretKey: admin.passwordMtime
      remoteRef:
        key: student-mgmt/argocd/admin
        property: passwordMtime
