apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-repo
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: argocd-repo-student-mgmt
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
  data:
    - secretKey: url
      remoteRef:
        key: student-mgmt/argocd/repo
        property: url
    - secretKey: username
      remoteRef:
        key: student-mgmt/argocd/repo
        property: username
    - secretKey: password
      remoteRef:
        key: student-mgmt/argocd/repo
        property: token
