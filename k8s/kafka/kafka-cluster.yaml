# Strimzi Kafka 클러스터 (KRaft 모드, ZooKeeper 없음).
# 단일 노드라 모든 복제 인자를 1로 — 데모/가점용. 운영 강화 시 노드 풀 replicas↑ + 복제 인자↑.
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: student-kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    # version 생략 — 오퍼레이터가 지원 기본 버전 사용(차트 버전과 자동 정합).
    listeners:
      # 클러스터 내부 평문 리스너. 백엔드(CdcConsumer)·Connect가 사용.
      # bootstrap 서비스: student-kafka-kafka-bootstrap.kafka.svc:9092
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      # Debezium이 데이터/스키마이력 토픽을 자동 생성하도록 허용.
      auto.create.topics.enable: "true"
