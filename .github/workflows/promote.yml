name: Promote
on:
  workflow_dispatch:
    inputs:
      from:
        description: "원본 환경"
        type: choice
        options: [dev, staging]
        default: dev
      to:
        description: "대상 환경"
        type: choice
        options: [staging, prod]
        default: staging

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up kustomize
        run: |
          KUSTOMIZE_VERSION=5.4.3
          curl -sLo kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/

      - name: Set up yq
        run: |
          YQ_VERSION=4.44.3
          sudo curl -sL -o /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq

      - name: Copy pinned images from source to target overlay
        run: |
          for svc in backend frontend; do
            IMG=$(yq ".images[] | select(.name == \"student-mgmt/$svc\") | .newName + \":\" + .newTag" "k8s/overlays/${{ inputs.from }}/kustomization.yaml")
            if [ -z "$IMG" ] || [ "$IMG" = "null" ]; then echo "ERROR: ${{ inputs.from }} overlay에서 student-mgmt/$svc 이미지를 찾지 못함"; exit 1; fi
            (cd "k8s/overlays/${{ inputs.to }}" && kustomize edit set image "student-mgmt/$svc=$IMG")
          done

      - name: Create promotion PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: promote/${{ inputs.from }}-to-${{ inputs.to }}
          title: "[promote] ${{ inputs.from }} → ${{ inputs.to }} 이미지 승격"
          body: |
            `${{ inputs.from }}` 환경의 핀된 이미지 태그를 `${{ inputs.to }}` 환경으로 승격합니다.
            머지하면 Argo CD가 `student-mgmt-${{ inputs.to }}` 네임스페이스를 동기화합니다. (머지가 배포 게이트)
          commit-message: "[chore] ${{ inputs.to }} 이미지 태그를 ${{ inputs.from }}에서 승격"
          add-paths: k8s/overlays/${{ inputs.to }}/kustomization.yaml
