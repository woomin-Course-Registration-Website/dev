name: CD

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
    paths-ignore:
      - 'k8s/**'
      - 'docs/**'

permissions:
  id-token: write   # GitHub OIDC 토큰 발급 (ECR 인증)
  contents: write   # dev overlay 이미지 태그 write-back 커밋

env:
  AWS_REGION: ap-northeast-2

jobs:
  build-and-push:
    name: Build & Push to ECR + GitOps write-back
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}  # terraform output github_actions_role_arn (ECR 전용)
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.ecr_login.outputs.registry }}/student-mgmt/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr_login.outputs.registry }}/student-mgmt/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up kustomize
        if: github.ref == 'refs/heads/main'
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Write-back image tag to dev overlay
        if: github.ref == 'refs/heads/main'
        run: |
          cd k8s/overlays/dev
          kustomize edit set image \
            student-mgmt/backend=${{ steps.ecr_login.outputs.registry }}/student-mgmt/backend:${{ github.sha }} \
            student-mgmt/frontend=${{ steps.ecr_login.outputs.registry }}/student-mgmt/frontend:${{ github.sha }}

      - name: Commit & push write-back
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git commit -m "[chore] dev 이미지 태그 갱신 → ${{ github.sha }}" || { echo "no image change"; exit 0; }
          git push origin HEAD:main
