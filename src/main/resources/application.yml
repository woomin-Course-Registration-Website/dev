spring:
  datasource:
    url: jdbc:mysql://localhost:3306/student_management?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 기존 DB(ddl-auto로 만들어진)는 V1을 적용된 상태로 표시 → 신규 DB에만 V1 실행
    baseline-on-migrate: true
    baseline-version: 1

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: student-management

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-must-be-at-least-256-bits-long}
  access-token-expiration: 900000       # 15분 (ms)
  refresh-token-expiration: 604800000   # 7일 (ms)

cors:
  allowed-origins:
    - "*"

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: create-drop   # 로컬 빠른 반복용 — Flyway 비활성
    show-sql: true
  flyway:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate      # Hibernate 자동 스키마 변경 금지 — Flyway가 관리
    show-sql: false
  flyway:
    enabled: true

---
# schemadump 프로파일: JPA 메타데이터에서 V1__init.sql을 자동 생성한다.
# 사용법:
#   1. dev DB가 비어 있는 상태에서 ./gradlew bootRun --args='--spring.profiles.active=schemadump'
#   2. src/main/resources/db/migration/V1__init.sql 파일이 생성됨
#   3. 내용 검토 후 Ctrl+C로 종료, git 커밋
spring:
  config:
    activate:
      on-profile: schemadump
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      jakarta:
        persistence:
          schema-generation:
            scripts:
              action: create
              create-target: src/main/resources/db/migration/V1__init.sql
              create-source: metadata
  flyway:
    enabled: false
