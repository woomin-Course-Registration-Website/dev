spring:
  datasource:
    url: jdbc:mysql://localhost:3306/student_management?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: student-management

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-must-be-at-least-256-bits-long}
  access-token-expiration: 900000       # 15분 (ms)
  refresh-token-expiration: 604800000   # 7일 (ms)

cors:
  allowed-origins:
    - "*"

# 학습 분석(EP-08) 설정
app:
  analytics:
    # 분석(OLAP) 전용 DB — 운영 DB와 동일 인스턴스의 별도 데이터베이스(student_analytics).
    # 운영 DB는 Hibernate ddl-auto로 관리하고, 분석 DB는 아래 ddl-auto로 스타 스키마를 자동 생성한다.
    datasource:
      url: ${ANALYTICS_DATASOURCE_URL:jdbc:mysql://localhost:3306/student_analytics?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true}
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:password}
      driver-class-name: com.mysql.cj.jdbc.Driver
    ddl-auto: ${ANALYTICS_DDL_AUTO:update}
    # 배치 ETL 주기 (기본: 매시 정각). Spring cron 6필드.
    etl:
      cron: ${ANALYTICS_ETL_CRON:0 0 * * * *}
    # Kafka CDC 준실시간 적재 (가점) — true일 때만 CdcConsumer 활성
    cdc:
      enabled: ${APP_ANALYTICS_CDC_ENABLED:false}

# Kafka (CDC 활성 시에만 사용)
spring.kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  consumer:
    group-id: analytics-cdc
    auto-offset-reset: earliest
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# Anthropic Claude (AI 챗봇 — 선택). LLM_API_KEY 미설정 시 챗봇 비활성.
anthropic:
  api-key: ${LLM_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-opus-4-8}

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
app:
  analytics:
    ddl-auto: create-drop

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
