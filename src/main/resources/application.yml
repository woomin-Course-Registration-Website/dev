spring:
  datasource:
    url: jdbc:mysql://localhost:3306/student_management?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  forward-headers-strategy: framework

# Actuator: 운영 환경에서 K8s probe / 모니터링 시스템이 사용한다.
# health 그룹 분리: liveness(앱 프로세스 살아있는지) / readiness(트래픽 수용 가능한지).
# prometheus: ServiceMonitor가 30초 간격 스크랩.
# 보안: env, beans 등 민감 엔드포인트는 노출하지 않는다.
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: student-management

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-must-be-at-least-256-bits-long}
  access-token-expiration: 900000       # 15분 (ms)
  refresh-token-expiration: 604800000   # 7일 (ms)

cors:
  allowed-origins:
    - "*"

# 학습 분석(EP-08) 설정
app:
  analytics:
    # 분석(OLAP) 전용 DB — 운영 DB와 동일 인스턴스의 별도 데이터베이스(student_analytics).
    # 운영 DB는 Hibernate ddl-auto로 관리하고, 분석 DB는 아래 ddl-auto로 스타 스키마를 자동 생성한다.
    datasource:
      url: ${ANALYTICS_DATASOURCE_URL:jdbc:mysql://localhost:3306/student_analytics?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true}
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:password}
      driver-class-name: com.mysql.cj.jdbc.Driver
    ddl-auto: ${ANALYTICS_DDL_AUTO:update}
    # 배치 ETL 주기 (기본: 매시 정각). Spring cron 6필드.
    etl:
      cron: ${ANALYTICS_ETL_CRON:0 0 * * * *}
    # Kafka CDC 준실시간 적재 (가점) — true일 때만 CdcConsumer 활성
    cdc:
      enabled: ${APP_ANALYTICS_CDC_ENABLED:false}

# Kafka (CDC 활성 시에만 사용)
spring.kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  consumer:
    group-id: analytics-cdc
    auto-offset-reset: earliest
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# Anthropic Claude (AI 챗봇 — 선택). LLM_API_KEY 미설정 시 챗봇 비활성.
anthropic:
  api-key: ${LLM_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-opus-4-8}

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
app:
  analytics:
    ddl-auto: create-drop

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      # 학습용 프로젝트 — 마이그레이션 도구(Flyway) 미도입, Hibernate가 스키마 관리.
      # 운영 강화 시 validate + 마이그레이션 도구로 전환 권장.
      ddl-auto: update
    show-sql: false
  datasource:
    # HikariCP 풀 튜닝 — 기본값(max 10)은 K8s replica 2~3개에서 동시 트래픽 시 부족할 수 있음.
    # max 20: 단일 파드 기준 안전 상한 (MySQL max_connections는 보통 151+ → 충분).
    # connection-timeout 30s: 풀 고갈 시 빠른 실패로 hanging 방지.
    # leak-detection 5s: 30초 이상 점유 시 로그 경고 — 누수 모니터링.
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 30000

# prod에서는 JWT_SECRET 환경변수 미설정 시 즉시 기동 실패하도록 fallback 제거
jwt:
  secret: ${JWT_SECRET}

# prod에서는 CORS_ALLOWED_ORIGIN 환경변수로 명시적 origin 지정 필수 (와일드카드 차단)
cors:
  allowed-origins:
    - ${CORS_ALLOWED_ORIGIN}
